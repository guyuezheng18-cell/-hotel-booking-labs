2人</text><path d="M836 536l4 4 4-4" fill="none" stroke="#65758B" stroke-width="1.5"/><text x="88" y="599" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">入住日期</text><rect x="88" y="613" width="376" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="102" y="643" font-size="16" fill="#172B46" font-weight="500" text-anchor="start">2026-11-21</text><path d="M436 632l4 4 4-4" fill="none" stroke="#65758B" stroke-width="1.5"/><text x="488" y="599" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">退房日期</text><rect x="488" y="613" width="376" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="502" y="643" font-size="16" fill="#172B46" font-weight="500" text-anchor="start">2026-11-23</text><path d="M836 632l4 4 4-4" fill="none" stroke="#65758B" stroke-width="1.5"/><text x="88" y="695" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">联系人 *</text><rect x="88" y="709" width="224" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="102" y="739" font-size="16" fill="#172B46" font-weight="500" text-anchor="start">林同学</text><text x="336" y="695" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">联系电话 *</text><rect x="336" y="709" width="280" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="350" y="739" font-size="16" fill="#172B46" font-weight="500" text-anchor="start">13800000000</text><text x="640" y="695" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">入住人数 *</text><rect x="640" y="709" width="224" height="46" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="654" y="739" font-size="16" fill="#172B46" font-weight="500" text-anchor="start">2 人</text><path d="M836 728l4 4 4-4" fill="none" stroke="#65758B" stroke-width="1.5"/><rect x="88" y="792" width="232" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><text x="204.0" y="820" font-size="15" fill="#2463DA" font-weight="600" text-anchor="middle">更新报价</text><text x="344" y="819" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">当前展示下列新方案的最新查询报价。</text><rect x="64" y="896" width="824" height="198" rx="12" fill="#EAF1FD" stroke="none"/><text x="88" y="937" font-size="20" fill="#172B46" font-weight="600" text-anchor="start">先核对，再确认修改</text><text x="88" y="975" font-size="14" fill="#65758B" font-weight="400" text-anchor="start">核对方案不会保存修改，也不会为新行程保留房间。</text><text x="88" y="1012" font-size="14" fill="#65758B" font-weight="400" text-anchor="start">确认修改成功后重新等待酒店确认；若新方案被拒绝或超时，不恢复旧方案。</text><text x="88" y="1049" font-size="14" fill="#65758B" font-weight="400" text-anchor="start">修改失败时，本次操作不改变原方案；原订单仍可能因酒店处理或到期而变化。</text><rect x="912" y="394" width="464" height="466" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="936" y="435" font-size="21" fill="#172B46" font-weight="700" text-anchor="start">新方案报价</text><text x="936" y="465" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">1间房 · 2晚 · 到店付款</text><path d="M936 487L1352 487" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="936" y="527" font-size="14" fill="#172B46" font-weight="400" text-anchor="start">2026-11-21 · 1晚</text><text x="1352" y="527" font-size="17" fill="#172B46" font-weight="500" text-anchor="end">¥308.00</text><text x="936" y="571" font-size="14" fill="#172B46" font-weight="400" text-anchor="start">2026-11-22 · 1晚</text><text x="1352" y="571" font-size="17" fill="#172B46" font-weight="500" text-anchor="end">¥298.00</text><path d="M936 599L1352 599" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="936" y="636" font-size="16" fill="#172B46" font-weight="600" text-anchor="start">新方案总价</text><text x="1352" y="646" font-size="34" fill="#172B46" font-weight="700" text-anchor="end">¥606.00</text><text x="936" y="683" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">原总价 ¥556.00 → 新总价 ¥606.00（增加¥50.00）</text><rect x="936" y="713" width="416" height="44" rx="8" fill="#2463DA" stroke="#2463DA"/><tex