<text x="332" y="305" font-size="22" fill="#172B46" font-weight="700" text-anchor="start">南京栖岸酒店</text><text x="332" y="333" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">南京 · 鼓楼区 · 中山北路</text><text x="332" y="367" font-size="18" fill="#172B46" font-weight="600" text-anchor="start">舒适大床房</text><text x="332" y="395" font-size="14" fill="#65758B" font-weight="400" text-anchor="start">1张1.8米大床 · 最多入住2人</text><rect x="332" y="418" width="72" height="27" rx="5" fill="#EFF5FF" stroke="none"/><text x="368.0" y="436" font-size="12" fill="#2463DA" font-weight="500" text-anchor="middle">1 间房</text><rect x="416" y="418" width="72" height="27" rx="5" fill="#EFF5FF" stroke="none"/><text x="452.0" y="436" font-size="12" fill="#2463DA" font-weight="500" text-anchor="middle">2 晚</text><text x="864" y="464" font-size="13" fill="#2463DA" font-weight="400" text-anchor="end">返回查询，重新选择房型或日期</text><rect x="64" y="516" width="824" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="88" y="550" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">入住日期</text><text x="88" y="584" font-size="23" fill="#172B46" font-weight="600" text-anchor="start">2026-11-20</text><text x="88" y="615" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">14:00起办理入住</text><path d="M454 540L454 620" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="488" y="550" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">退房日期</text><text x="488" y="584" font-size="23" fill="#172B46" font-weight="600" text-anchor="start">2026-11-22</text><text x="488" y="615" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">12:00前办理退房</text><rect x="64" y="668" width="824" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="88" y="707" font-size="20" fill="#172B46" font-weight="600" text-anchor="start">入住信息</text><text x="88" y="742" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">联系人 *</text><rect x="88" y="757" width="240" height="44" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="102" y="785" font-size="15" fill="#172B46" font-weight="400" text-anchor="start">林同学</text><text x="352" y="742" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">联系电话 *</text><rect x="352" y="757" width="280" height="44" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="366" y="785" font-size="15" fill="#8A99AC" font-weight="400" text-anchor="start">请输入联系电话</text><text x="656" y="742" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">入住人数 *</text><rect x="656" y="757" width="208" height="44" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/><text x="670" y="785" font-size="15" fill="#172B46" font-weight="400" text-anchor="start">2 人</text><path d="M835 775l4 4 4-4" fill="none" stroke="#65758B" stroke-width="1.5"/><text x="88" y="829" font-size="12" fill="#65758B" font-weight="400" text-anchor="start">请填写可联系到您的电话。入住人数限1–2人。</text><rect x="64" y="872" width="824" height="222" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="88" y="911" font-size="20" fill="#172B46" font-weight="600" text-anchor="start">预订须知</text><text x="88" y="948" font-size="13" fill="#172B46" font-weight="600" text-anchor="start">等待确认</text><text x="166" y="948" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">酒店须在提交后30分钟内处理，最晚不超过入住日次日00:00。</text><text x="88" y="985" font-size="13" fill="#172B46" font-weight="600" text-anchor="start">超时处理</text><text x="166" y="985" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">截止仍未确认将自动取消，您会收到系统内通知。</text><text x="88" y="1022" font-size="13" fill="#172B46" font-weight="600" text-anchor="start">取消规则</text><text x="166" y="1022" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">待确认须在确认截止前取消；已确认须在入住日00:00前取消。</text><text x="88" y="1059" font-size="13" fill="#172B46" font-weight="600" text-anchor="start">到店时间</text><text x="166" y="1059" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">入住日14:00至次日00:00前办理；已确认但到期未入住将自动取消。</text><rect x="912" y="256" width="464" height="516" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="936" y="299" font-size="22" fill="#172B46" font-weight="700" text-anchor="start">费用明细</text><text x="936" y="326" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">人民币 · 1间房 · 2晚</text><path d="M936 349L1352 349" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="936" y="390" font-size="15" fill="#172B46" font-weight="400" text-anchor="start">11月20日  ·  1晚</text><text x="1352" y="390" font-size="17" fill="#172B46" font-weight="500" text-anchor="end">¥268.00</text><text x="936" y="437" font-size="15" fill="#172B46" font-weight="400" text-anchor="start">11月21日  ·  1晚</text><text x="1352" y="437" font-size="17" fill="#172B46" font-weight="500" text-anchor="end">¥288.00</text><path d="M936 464L1352 464" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="936" y="502" font-size="16" fill="#172B46" font-weight="600" text-anchor="start">住宿总价</text><text x="1352" y="510" font-size="34" fill="#172B46" font-weight="700" text-anchor="end">¥556.00</text><rect x="936" y="532" width="100" height="27" rx="5" fill="#E8F5F0" stroke="none"/><text x="986.0" y="550" font-size="12" fill="#15816A" font-weight="500" text-anchor="middle">到店付款</text><text x="1050" y="550" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">本次无需在线支付</text><rect x="936" y="580" width="416" height="64" rx="8" fill="#F0F5FD" stroke="none"/><text x="952" y="606" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">提交时会再次核对房价与余房。</text><text x="952" y="629" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">如房价变化，将请您重新确认。</text><rect x="936" y="668" width="416" height="44" rx="8" fill="#2463DA" stroke="#2463DA"/><text x="1144.0" y="696" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">提交预订 · ¥556.00</text><text x="1144" y="741" font-size="13" fill="#65758B" font-weight="400" text-anchor="middle">提交成功即保留房间，订单进入“待确认”。</text><rect x="912" y="796" width="464" height="140" rx="12" fill="#EAF1FD" stroke="none"/><text x="936" y="832" font-size="17" fill="#172B46" font-weight="600" text-anchor="start">确认后再安排入住</text><text x="936" y="864" font-size="14" fill="#65758B" font-weight="400" text-anchor="start">提交成功不代表酒店已经确认。</text><text x="936" y="892" font-size="13" fill="#65758B" font-weight="400" text-anchor="start">可在“我的订单”和“消息通知”查看处理结果。</text><text x="936" y="917" font-size="12" fill="#65758B" font-weight="400" text-anchor="start">若提交结果暂未返回，请先查询订单结果。</text></g></svg>